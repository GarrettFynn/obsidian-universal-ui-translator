name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build plugin
        run: npm run build

      # 构建产物来源证明（官方目录审核的 Releases 建议项）：用户可加密验证产物确由本仓库构建
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release with plugin files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release delete "$tag" --yes || true
          {
            cat .github/release-intro.md
            echo
            awk -v v="$tag" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ && f {exit} f' CHANGELOG.md
          } > release-body.md
          gh release create "$tag" main.js manifest.json styles.css --title "$tag" --notes-file release-body.md
